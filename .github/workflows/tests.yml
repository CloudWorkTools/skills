name: Tests

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up baseline Python
        id: baseline
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Set up test Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependencies
        run: python3 -m pip install -r skills/flow-docs-sync/scripts/requirements-ast.txt
      - name: Run repository tests
        env:
          FLOW_REQUIRE_TREE_SITTER: '1'
          FLOW_TEST_OLD_PYTHON: ${{ steps.baseline.outputs.python-path }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: npm test
