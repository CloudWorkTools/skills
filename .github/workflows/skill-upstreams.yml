name: Check skill upstreams

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: teaching-upstream-review
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        skill: [teaching-with-diagrams, readme-value]
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Compare reviewed sources with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_ASSIGNEE: jhihweijhan
          UPSTREAM_SKILL: ${{ matrix.skill }}
        shell: bash
        run: |
          set +e
          node "skills/$UPSTREAM_SKILL/scripts/check-upstreams.mjs" > "$RUNNER_TEMP/upstream-report.json" 2>&1
          status=$?
          set -e
          {
            echo '## Skill upstream report'
            echo '```json'
            cat "$RUNNER_TEMP/upstream-report.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 2 ]; then
            node scripts/upstream-pr.mjs "$RUNNER_TEMP/upstream-report.json" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -ne 0 ]; then
            echo '::error::Some upstream checks failed. Review the job summary.'
            exit "$status"
          fi
